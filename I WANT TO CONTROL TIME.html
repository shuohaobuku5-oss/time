<!DOCTYPE html>
<!-- saved from url=(0135)file:///C:/Users/%E8%B0%A2%E8%8B%B1/Documents/Codex/2026-09-26/first-install-and-use-the-following/outputs/time-control/dist/index.html -->
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09111c">
  <title>I WANT TO CONTROL TIME</title>
  <meta name="description" content="Move through an evening. An interactive photographic experience from sunset to starlight.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2309111c'/%3E%3Ccircle cx='16' cy='16' r='10' stroke='%23edcf9b' fill='none'/%3E%3Cpath d='M16 8v8l5 3' fill='none' stroke='%23edcf9b'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./I WANT TO CONTROL TIME_files/style.css">
  <script src="./I WANT TO CONTROL TIME_files/gsap.min.js"></script>
  <script type="module" src="./I WANT TO CONTROL TIME_files/app.js"></script>
</head>
<body>
  <main id="experience" aria-label="Control the flow of an evening">
    <div id="fallback" aria-hidden="true"></div>
    <canvas id="scene" aria-hidden="true"></canvas>
    <div class="shade" aria-hidden="true"></div>
    <header class="topbar">
      <a class="wordmark" href="file:///C:/Users/%E8%B0%A2%E8%8B%B1/Documents/Codex/2026-09-26/first-install-and-use-the-following/outputs/time-control/dist/" aria-label="I want to control time, home"><span class="mark">◷</span><span>I WANT TO<br><strong>CONTROL TIME</strong></span></a>
      <div class="clock"><time id="time">18:42</time><div class="phase"><span></span><output id="phase">SUNSET</output></div></div>
      <button id="fullscreen" class="quiet" aria-label="Enter fullscreen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"></path></svg><span>FULLSCREEN</span></button>
    </header>
    <div class="side-note" aria-hidden="true">AN EVENING, IN YOUR HANDS</div>
    <div class="scene-caption"><span id="chapter">01 / 05</span><span id="location">THE LAST LIGHT</span></div>
    <section class="console" aria-label="Time controller">
      <div class="console-heading"><p>Let the world move at your pace.</p><button class="quiet play" id="play" aria-label="Let time flow" aria-pressed="false"><span id="play-icon">▷</span><span id="play-label">LET TIME FLOW</span></button></div>
      <div class="timeline">
        <div class="ticks" aria-hidden="true"></div><div class="track" aria-hidden="true"></div><div class="progress" aria-hidden="true"></div>
        <input type="range" id="timeline" min="0" max="1000" value="0" step="1" aria-label="Time of evening" aria-valuetext="18:42, Sunset">
      </div>
      <div class="stops" aria-label="Evening phases">
        <button data-stop="0" class="active" aria-pressed="true"><span>18:42</span><strong>SUNSET</strong></button>
        <button data-stop="1" aria-pressed="false"><span>19:08</span><strong>GOLDEN HOUR</strong></button>
        <button data-stop="2" aria-pressed="false"><span>19:46</span><strong>BLUE HOUR</strong></button>
        <button data-stop="3" aria-pressed="false"><span>20:35</span><strong>NIGHT</strong></button>
        <button data-stop="4" aria-pressed="false"><span>22:18</span><strong>STARRY SKY</strong></button>
      </div>
      <footer><span>DRAG TO EXPLORE <i>↔</i></span><span class="keyboard">← → TO MOVE THROUGH TIME</span><span id="motion-label">A MOMENT TO STAY</span></footer>
    </section>
    <p id="notice" role="status"></p>
  </main>


</body></html>
